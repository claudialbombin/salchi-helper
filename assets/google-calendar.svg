<style>
  .tap  { animation: tap .32s steps(1) infinite; }
  .tap2 { animation: tap .32s steps(1) infinite; animation-delay: -.16s; }
  @keyframes tap { 0% { transform: translateY(0); } 50% { transform: translateY(3px); } }
  .wag { transform-box: fill-box; transform-origin: 0% 50%; animation: wag .64s steps(1) infinite; }
  @keyframes wag { 0% { transform: rotate(-24deg); } 50% { transform: rotate(10deg); } }
  .blink { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.15); } }
  .steam { animation: steam 2.4s ease-in-out infinite; opacity: 0; }
  .steam.s2 { animation-delay: -1.2s; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(4px); } 30% { opacity: .7; } 100% { opacity: 0; transform: translateY(-14px); } }
  .bob { animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .float { animation: float 6s ease-in-out infinite; opacity: 0; }
  @keyframes float { 0% { opacity: 0; transform: translateY(18px) rotate(-6deg); } 12% { opacity: 1; }
                     70% { opacity: 1; } 100% { opacity: 0; transform: translateY(-40px) rotate(6deg); } }
  .tick { stroke-dasharray: 20; stroke-dashoffset: 20; animation: tick 6s ease-out infinite; }
  @keyframes tick { 0%, 25% { stroke-dashoffset: 20; } 40%, 100% { stroke-dashoffset: 0; } }
  .pop { transform-box: fill-box; transform-origin: 100% 100%; animation: pop 5s ease-in-out infinite; }
  @keyframes pop { 0%, 30% { opacity: 0; transform: scale(.4); } 40%, 85% { opacity: 1; transform: scale(1); } 95%, 100% { opacity: 0; transform: scale(.4); } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .run { animation: run 5s ease-in-out infinite; }
  @keyframes run { 0%, 8% { transform: translateX(0); } 42%, 58% { transform: translateX(var(--dist)); } 92%, 100% { transform: translateX(0); } }
  .face { animation: face 5s steps(1) infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes face { 0% { transform: scaleX(1); } 50% { transform: scaleX(-1); } }
  .legA { transform-box: fill-box; transform-origin: 50% 0%; animation: leg .28s linear infinite alternate; }
  .legB { transform-box: fill-box; transform-origin: 50% 0%; animation: leg .28s linear infinite alternate-reverse; }
  @keyframes leg { from { transform: rotate(-28deg); } to { transform: rotate(28deg); } }
  .drop { animation: drop 3.2s ease-in infinite; }
  @keyframes drop { 0%, 15% { transform: translateY(0); opacity: 1; } 55% { transform: translateY(42px); opacity: 1; } 65%, 100% { transform: translateY(42px); opacity: 0; } }
  .lid { transform-box: fill-box; transform-origin: 50% 100%; animation: lid 3.2s ease-in-out infinite; }
  @keyframes lid { 0%, 10% { transform: rotate(0); } 25%, 55% { transform: rotate(-28deg); } 70%, 100% { transform: rotate(0); } }
  .spin { transform-box: fill-box; transform-origin: 50% 50%; animation: spin 4s linear infinite; }
  .spin.rev { animation-direction: reverse; animation-duration: 3s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fill { animation: fill 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 50%; }
  @keyframes fill { 0% { transform: scaleX(0); } 70%, 85% { transform: scaleX(1); } 100% { transform: scaleX(1); opacity: 0; } }
  .type { animation: type 6s steps(28) infinite; }
  @keyframes type { 0% { width: 0; } 55%, 100% { width: var(--w); } }
  .cursor { animation: cursor .8s steps(1) infinite; }
  @keyframes cursor { 50% { opacity: 0; } }
  .stick { opacity: 0; animation: stick 7s ease-out infinite; transform-box: fill-box; transform-origin: 50% 0%; }
  @keyframes stick { 0% { opacity: 0; transform: translateY(-12px) rotate(-10deg); } 6% { opacity: 1; transform: translateY(0) rotate(-3deg); } 85% { opacity: 1; } 95%, 100% { opacity: 0; } }
  .text { font-family: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .float, .stick, .steam { opacity: 1; } }
