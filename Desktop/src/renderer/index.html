<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
<title>Salchi</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Collapsed state: the dachshund at its desk. The sticker on the laptop shows the task count. -->
<svg id="dog" viewBox="6 11 140 93" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="70" cy="99" rx="62" ry="3.5" fill="rgba(0,0,0,.10)"/>

  <!-- tail -->
  <rect x="123" y="43" width="22" height="6" rx="3" fill="#a36130">
    <animateTransform attributeName="transform" type="rotate" values="-24 123 46;10 123 46"
                      dur="0.64s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>

  <!-- body -->
  <rect x="40" y="40" width="92" height="28" rx="14" fill="#a36130"/>
  <rect x="68" y="42" width="56" height="6" rx="3" fill="#6e3d1c" opacity=".22"/>

  <!-- head -->
  <ellipse cx="27" cy="36" rx="5.5" ry="12.5" fill="#6e3d1c"/>
  <ellipse cx="57" cy="36" rx="5.5" ry="12.5" fill="#6e3d1c"/>
  <ellipse cx="42" cy="28" rx="16" ry="14" fill="#a36130"/>
  <ellipse cx="42" cy="38" rx="9" ry="6" fill="#d6a16b"/>
  <ellipse cx="42" cy="34" rx="3.5" ry="2.5" fill="#111"/>
  <g fill="#111">
    <rect x="33" y="22.5" width="4" height="5" rx="2">
      <animate attributeName="height" values="5;1;5" keyTimes="0;0.03;0.06" dur="4.5s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="y" values="22.5;24.5;22.5" keyTimes="0;0.03;0.06" dur="4.5s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <rect x="47" y="22.5" width="4" height="5" rx="2">
      <animate attributeName="height" values="5;1;5" keyTimes="0;0.03;0.06" dur="4.5s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="y" values="22.5;24.5;22.5" keyTimes="0;0.03;0.06" dur="4.5s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- desk -->
  <rect x="16" y="69" width="4" height="30" rx="2" fill="#996e45"/>
  <rect x="120" y="69" width="4" height="30" rx="2" fill="#996e45"/>
  <rect x="7" y="63.5" width="126" height="7" rx="3" fill="#cc9e6e"/>

  <!-- coffee mug -->
  <rect x="99" y="52.5" width="10" height="11" rx="2" fill="#fff"/>
  <circle cx="110" cy="58" r="3" fill="none" stroke="#fff" stroke-width="2"/>

  <!-- laptop lid, with the counter sticker -->
  <rect x="19" y="61.5" width="54" height="3" rx="1" fill="#999"/>
  <rect x="23" y="41" width="46" height="22" rx="4" fill="#dcdee3"/>
  <g transform="rotate(-4 46 52)">
    <rect id="stickerBg" x="35" y="44.5" width="22" height="15" rx="3" fill="#f7e2a0"/>
    <text id="sticker" x="46" y="56" text-anchor="middle" font-size="12" font-weight="800"
          font-family="Segoe UI, system-ui, sans-serif" fill="rgba(0,0,0,.8)">✓</text>
  </g>

  <!-- paws, typing -->
  <rect x="26.5" y="34" width="9" height="8" rx="4" fill="#a36130">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 3"
                      dur="0.32s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>
  <rect x="56.5" y="34" width="9" height="8" rx="4" fill="#a36130">
    <animateTransform attributeName="transform" type="translate" values="0 3;0 0"
                      dur="0.32s" calcMode="discrete" repeatCount="indefinite"/>
  </rect>

  <g id="errorBadge" hidden>
    <circle cx="64" cy="18" r="7.5" fill="#e0392b"/>
    <text x="64" y="22" text-anchor="middle" font-size="11" font-weight="900" fill="#fff"
          font-family="Segoe UI, system-ui, sans-serif">!</text>
  </g>
</svg>

<!-- Expanded state: the task card. -->
<div id="card">
  <header id="head">
    <span class="title" data-i18n="header.title"></span>
    <span id="count" class="chip">0</span>
    <span id="spinner" class="spin"></span>
    <span class="sp"></span>
    <button class="icon notion-only" id="refreshButton" data-i18n-title="header.reload">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 8.6A5.3 5.3 0 1 1 11.6 4"/><path d="M12.5 1.8v3h-3"/></svg>
    </button>
    <button class="icon" id="pinButton" data-i18n-title="header.keepOpen">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M5.5 1.8h5l-.7 4.4 2.6 2.4H3.6l2.6-2.4z"/><path d="M8 8.6v5.6"/></svg>
    </button>
    <button class="icon" id="settingsButton" data-i18n-title="header.settings">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="2.3"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
    </button>
  </header>

  <div id="taskList"></div>

  <!-- Date picker, shown instead of the list while choosing a due date. -->
  <section id="datePanel" hidden>
    <div class="dp-head">
      <span id="datePanelTitle"></span>
      <button class="icon" id="datePanelClose" data-i18n-title="picker.close">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>
    <div class="chips" id="quickPicks">
      <button data-pick="today" data-i18n="picker.today"></button>
      <button data-pick="tomorrow" data-i18n="picker.tomorrow"></button>
      <button data-pick="saturday"></button>
      <button data-pick="monday"></button>
    </div>
    <div>
      <div class="cal-nav">
        <button id="prevMonth" data-i18n-title="picker.prevMonth">‹</button>
        <span id="monthLabel"></span>
        <button id="nextMonth" data-i18n-title="picker.nextMonth">›</button>
      </div>
      <div class="cal-grid" id="calendarGrid"></div>
    </div>
    <div class="dp-time">
      <label><input type="checkbox" id="hasTimeInput"> <span data-i18n="picker.atTime"></span></label>
      <input type="time" id="timeInput" value="09:00" hidden>
    </div>
    <div class="dp-actions">
      <button class="linkbtn" id="clearDueButton" data-i18n="task.removeDate"></button>
      <span class="sp"></span>
      <span class="dp-warning" id="pastWarning" hidden></span>
      <button class="primary" id="confirmDueButton" data-i18n="picker.confirm"></button>
    </div>
  </section>

  <section id="settings" hidden>
    <div class="notion-only">
      <h3 data-i18n="settings.connectNotion"></h3>
      <ol>
        <!-- Step 1 contains a link, so app.js builds it around the {link} placeholder. -->
        <li id="notionStep1"></li>
        <li data-i18n="settings.notionStep2"></li>
        <li data-i18n="settings.notionStep3"></li>
      </ol>
      <input id="tokenInput" type="password" spellcheck="false">
      <input id="linkInput" type="text" data-i18n-placeholder="settings.linkPlaceholder" spellcheck="false">
    </div>
    <h3 class="local-only" data-i18n="settings.title"></h3>
    <label class="language-row"><span data-i18n="settings.language"></span> <select id="languageSelect"></select></label>
    <label><input type="checkbox" id="autostartInput"> <span id="autostartLabel"></span></label>
    <p class="note local-only" id="localNote"></p>
    <div class="actions notion-only">
      <span id="settingsMessage"></span>
      <button id="saveSettingsButton" data-i18n="settings.save"></button>
    </div>
  </section>

  <!-- First start: choose a language before anything else. -->
  <section id="languagePanel" hidden>
    <h3 data-i18n="language.choose"></h3>
    <div id="languageList" role="listbox"></div>
    <div class="dp-actions">
      <span class="sp"></span>
      <button class="primary" id="languageContinueButton" data-i18n="language.continue"></button>
    </div>
  </section>

  <footer id="addBar">
    <span>＋</span>
    <input id="draftInput" data-i18n-placeholder="draft.placeholder" spellcheck="false">
    <button class="duechip" id="draftDueChip" data-i18n-title="task.changeDate" hidden></button>
    <button class="icon" id="draftDateButton" data-i18n-title="draft.dateHint"></button>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
